name: znal_ai
description: ZNAL AI - Advanced Chatbot with Voice, Code Panel & File Generation

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # HTTP & API
  http: ^1.1.0
  dio: ^5.3.0
  
  # Voice & Audio
  speech_to_text: ^6.3.0
  flutter_tts: ^0.0.9
  record: ^5.0.0
  
  # File Generation
  pdf: ^3.10.0
  excel: ^2.1.0
  docx_template: ^5.4.0
  path_provider: ^2.1.0
  file_picker: ^6.0.0
  
  # UI & State
  provider: ^6.0.0
  get: ^4.6.0
  flutter_markdown: ^0.6.0
  highlight: ^0.7.0
  
  # Storage
  shared_preferences: ^2.2.0
  hive: ^2.2.0
  hive_flutter: ^1.1.0
  
  # Utils
  intl: ^0.19.0
  uuid: ^4.0.0
  url_launcher: ^6.2.0
  
  # UI Components
  cupertino_icons: ^1.0.2
  google_fonts: ^6.0.0
  flutter_animate: ^4.2.0
  loading_animation_widget: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  build_runner: ^2.4.0
  hive_generator: ^2.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/
    - assets/icons/
    - assets/images/
  
  fonts:
    - family: Segoe
      fonts:
        - asset: assets/fonts/segoe_ui_regular.ttf
        - asset: assets/fonts/segoe_ui_bold.ttf
          weight: 700
