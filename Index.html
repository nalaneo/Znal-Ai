<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#040408">
  <meta name="description" content="ZNAL AI sedang dalam pemeliharaan.">

  <title>ZNAL Error — Sedang Diperbaiki</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="background">
    <div class="aurora aurora-a"></div>
    <div class="aurora aurora-b"></div>
    <div class="aurora aurora-c"></div>

    <div class="grid"></div>
    <div class="vignette"></div>
    <div class="noise"></div>

    <div class="particles">
      <span></span>
      <span></span>
      <span></span>
      <span></span>
      <span></span>
      <span></span>
      <span></span>
      <span></span>
      <span></span>
      <span></span>
    </div>
  </div>

  <div class="scanline"></div>

  <div class="corner top-left"></div>
  <div class="corner top-right"></div>
  <div class="corner bottom-left"></div>
  <div class="corner bottom-right"></div>

  <main class="main">

    <div class="logo-wrap">
      <div class="logo-ring"></div>

      <div class="logo">
        <span>Z</span>
      </div>
    </div>

    <div class="status">
      <span class="status-dot"></span>
      <span>System Maintenance</span>
    </div>

    <h1>
      <span>ZNAL</span> Error
    </h1>

    <p class="subtitle">
      <strong>ZNAL AI</strong> sedang mengalami gangguan sementara
      dan saat ini sedang diperbaiki oleh sistem.
      <br>
      Mohon tunggu beberapa saat sampai layanan kembali normal.
    </p>

    <section class="card">

      <div class="card-header">

        <div class="card-title">
          <div class="card-icon">↻</div>

          <div>
            <small>STATUS</small>
            <strong id="statusText">Memperbaiki sistem</strong>
          </div>
        </div>

        <span id="processText">PROCESSING</span>

      </div>

      <div class="progress">
        <div class="progress-bar"></div>
      </div>

      <div class="card-footer">
        <span>ZNAL CORE</span>
        <span>SYSTEM RECOVERY</span>
      </div>

    </section>

    <div class="system-status">

      <div>
        <i class="active"></i>
        CORE
      </div>

      <div>
        <i class="active"></i>
        AI
      </div>

      <div>
        <i></i>
        SYNC
      </div>

    </div>

    <footer>
      <strong>ZNAL AI</strong>
      <span>•</span>
      BUILT BY NALANEO
    </footer>

  </main>

  <script src="script.js"></script>

</body>
</html>
