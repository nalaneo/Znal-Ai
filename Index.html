<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#050509">
<meta name="color-scheme" content="dark">
<meta name="description" content="ZNAL AI sedang dalam pemeliharaan.">

<title>ZNAL Error — Sedang Diperbaiki</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

:root{
--bg:#040408;
--bg2:#08070e;
--text:#f8f7ff;
--muted:#9893a8;
--muted2:#625d70;
--line:rgba(255,255,255,.08);
--glass:rgba(255,255,255,.035);
--purple:#8b6cff;
--purple2:#b29cff;
--blue:#5d8dff;
}

html,
body{
width:100%;
min-height:100%;
}

body{
min-height:100vh;
overflow:hidden;
position:relative;
display:flex;
align-items:center;
justify-content:center;
background:
radial-gradient(
circle at 50% 40%,
#171326 0%,
#0b0912 30%,
#05050a 63%,
#020204 100%
);
color:var(--text);
font-family:
Inter,
ui-sans-serif,
system-ui,
-apple-system,
BlinkMacSystemFont,
"Segoe UI",
sans-serif;
-webkit-font-smoothing:antialiased;
}

/* =========================================
   BACKGROUND
========================================= */

.background{
position:fixed;
inset:0;
overflow:hidden;
pointer-events:none;
}

.aurora{
position:absolute;
width:70vw;
height:70vw;
max-width:900px;
max-height:900px;
border-radius:50%;
filter:blur(120px);
opacity:.14;
mix-blend-mode:screen;
}

.aurora.a{
top:-40%;
left:-20%;
background:#694cff;
animation:auroraA 14s ease-in-out infinite;
}

.aurora.b{
right:-25%;
bottom:-40%;
background:#984cff;
animation:auroraB 17s ease-in-out infinite;
}

.aurora.c{
left:25%;
top:30%;
width:40vw;
height:40vw;
background:#356cff;
opacity:.07;
animation:auroraC 20s ease-in-out infinite;
}

@keyframes auroraA{
0%,100%{
transform:translate3d(0,0,0) scale(1);
}
50%{
transform:translate3d(80px,50px,0) scale(1.12);
}
}

@keyframes auroraB{
0%,100%{
transform:translate3d(0,0,0) scale(1);
}
50%{
transform:translate3d(-70px,-60px,0) scale(1.1);
}
}

@keyframes auroraC{
0%,100%{
transform:translate3d(0,0,0);
}
50%{
transform:translate3d(-50px,40px,0);
}
}

/* GRID */

.grid{
position:absolute;
inset:-100px;
opacity:.035;
background-image:
linear-gradient(
rgba(255,255,255,.5) 1px,
transparent 1px
),
linear-gradient(
90deg,
rgba(255,255,255,.5) 1px,
transparent 1px
);
background-size:55px 55px;
transform:perspective(500px) rotateX(55deg) scale(1.5);
transform-origin:center bottom;
mask-image:
linear-gradient(
to bottom,
transparent,
black 35%,
black 70%,
transparent
);
}

/* VIGNETTE */

.vignette{
position:absolute;
inset:0;
background:
radial-gradient(
ellipse at center,
transparent 35%,
rgba(0,0,0,.45) 100%
);
}

/* NOISE */

.noise{
position:absolute;
inset:-50%;
opacity:.025;
background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.7'/%3E%3C/svg%3E");
animation:noiseMove .25s steps(2) infinite;
}

@keyframes noiseMove{
0%{transform:translate(0,0)}
25%{transform:translate(2%,-1%)}
50%{transform:translate(-1%,2%)}
75%{transform:translate(1%,1%)}
100%{transform:translate(-2%,-1%)}
}

/* =========================================
   PARTICLES
========================================= */

.particles{
position:absolute;
inset:0;
}

.particle{
position:absolute;
width:2px;
height:2px;
border-radius:50%;
background:#b9adff;
box-shadow:0 0 10px rgba(150,130,255,.8);
opacity:.35;
animation:particleFloat linear infinite;
}

.particle:nth-child(1){
left:8%;
top:18%;
animation-duration:8s;
}

.particle:nth-child(2){
left:18%;
top:72%;
animation-duration:11s;
animation-delay:-3s;
}

.particle:nth-child(3){
left:30%;
top:27%;
animation-duration:9s;
animation-delay:-2s;
}

.particle:nth-child(4){
left:43%;
top:80%;
animation-duration:13s;
animation-delay:-7s;
}

.particle:nth-child(5){
left:57%;
top:15%;
animation-duration:10s;
animation-delay:-4s;
}

.particle:nth-child(6){
left:67%;
top:64%;
animation-duration:12s;
animation-delay:-6s;
}

.particle:nth-child(7){
left:79%;
top:31%;
animation-duration:9s;
animation-delay:-1s;
}

.particle:nth-child(8){
left:91%;
top:76%;
animation-duration:14s;
animation-delay:-9s;
}

.particle:nth-child(9){
left:13%;
top:45%;
animation-duration:15s;
animation-delay:-5s;
}

.particle:nth-child(10){
left:84%;
top:52%;
animation-duration:10s;
animation-delay:-8s;
}

@keyframes particleFloat{
0%{
transform:translateY(30px);
opacity:0;
}
20%{
opacity:.4;
}
50%{
transform:translateY(-30px) translateX(12px);
opacity:.7;
}
80%{
opacity:.25;
}
100%{
transform:translateY(-80px) translateX(-10px);
opacity:0;
}
}

/* =========================================
   MAIN
========================================= */

.main{
position:relative;
z-index:5;
width:min(92vw,680px);
padding:30px 0;
text-align:center;
animation:mainIn 1.1s cubic-bezier(.16,1,.3,1);
}

@keyframes mainIn{
0%{
opacity:0;
transform:translateY(30px) scale(.96);
filter:blur(10px);
}
100%{
opacity:1;
transform:translateY(0) scale(1);
filter:blur(0);
}
}

/* =========================================
   LOGO
========================================= */

.logo-wrap{
position:relative;
width:100px;
height:100px;
margin:0 auto 30px;
}

.logo-ring{
position:absolute;
inset:-14px;
border:1px solid rgba(145,120,255,.14);
border-radius:32px;
animation:ringRotate 12s linear infinite;
}

.logo-ring::before{
content:"";
position:absolute;
width:7px;
height:7px;
border-radius:50%;
background:#aa96ff;
box-shadow:
0 0 10px #8d72ff,
0 0 25px #8d72ff;
top:5px;
left:50%;
transform:translateX(-50%);
}

@keyframes ringRotate{
to{
transform:rotate(360deg);
}
}

.logo{
position:absolute;
inset:0;
display:grid;
place-items:center;
border-radius:29px;
background:
linear-gradient(
145deg,
rgba(35,31,55,.95),
rgba(9,8,15,.98)
);
border:1px solid rgba(255,255,255,.11);
box-shadow:
0 30px 80px rgba(0,0,0,.55),
inset 0 1px 0 rgba(255,255,255,.08),
0 0 60px rgba(120,90,255,.12);
animation:logoFloat 5s ease-in-out infinite;
}

.logo::before{
content:"";
position:absolute;
inset:1px;
border-radius:28px;
background:
linear-gradient(
135deg,
rgba(180,160,255,.15),
transparent 40%
);
pointer-events:none;
}

.logo::after{
content:"";
position:absolute;
width:65%;
height:65%;
border-radius:50%;
background:#8c6cff;
filter:blur(45px);
opacity:.12;
}

.logo-text{
position:relative;
z-index:2;
font-size:46px;
font-weight:950;
letter-spacing:-6px;
transform:translateX(-3px);
background:
linear-gradient(
145deg,
#ffffff 5%,
#ded8ff 45%,
#8b72ff 100%
);
-webkit-background-clip:text;
background-clip:text;
color:transparent;
filter:
drop-shadow(0 0 15px rgba(145,115,255,.35));
}

@keyframes logoFloat{
0%,100%{
transform:translateY(0);
}
50%{
transform:translateY(-7px);
}
}

/* =========================================
   STATUS
========================================= */

.status{
display:inline-flex;
align-items:center;
gap:9px;
padding:8px 14px;
margin-bottom:18px;
border:1px solid rgba(255,255,255,.08);
border-radius:999px;
background:rgba(255,255,255,.035);
box-shadow:
inset 0 1px 0 rgba(255,255,255,.04);
backdrop-filter:blur(15px);
-webkit-backdrop-filter:blur(15px);
color:#aaa5b7;
font-size:11px;
font-weight:700;
letter-spacing:.5px;
text-transform:uppercase;
}

.status-dot{
position:relative;
width:7px;
height:7px;
border-radius:50%;
background:#a18bff;
box-shadow:
0 0 8px #9a80ff,
0 0 20px rgba(150,120,255,.65);
}

.status-dot::before{
content:"";
position:absolute;
inset:-5px;
border:1px solid rgba(150,120,255,.25);
border-radius:50%;
animation:dotPulse 2s ease-out infinite;
}

@keyframes dotPulse{
0%{
transform:scale(.5);
opacity:1;
}
100%{
transform:scale(2);
opacity:0;
}
}

/* =========================================
   TITLE
========================================= */

.title{
position:relative;
font-size:clamp(46px,10vw,82px);
line-height:.92;
font-weight:950;
letter-spacing:-5px;
background:
linear-gradient(
180deg,
#ffffff 0%,
#f4f1ff 35%,
#aaa2ba 100%
);
-webkit-background-clip:text;
background-clip:text;
color:transparent;
filter:drop-shadow(0 15px 35px rgba(0,0,0,.4));
}

.title::after{
content:"ZNAL ERROR";
position:absolute;
left:0;
right:0;
top:3px;
z-index:-1;
color:rgba(130,100,255,.15);
filter:blur(25px);
}

.title .accent{
background:
linear-gradient(
135deg,
#ffffff,
#b5a5ff 45%,
#8064ff
);
-webkit-background-clip:text;
background-clip:text;
color:transparent;
}

/* =========================================
   SUBTITLE
========================================= */

.subtitle{
max-width:540px;
margin:21px auto 0;
padding:0 15px;
font-size:clamp(14px,3.8vw,17px);
line-height:1.75;
color:#9994a5;
font-weight:500;
}

.subtitle strong{
color:#ddd9e7;
font-weight:750;
}

/* =========================================
   CARD
========================================= */

.card{
position:relative;
margin:34px auto 0;
padding:20px;
width:min(100%,500px);
border-radius:20px;
border:1px solid rgba(255,255,255,.075);
background:
linear-gradient(
145deg,
rgba(255,255,255,.045),
rgba(255,255,255,.018)
);
box-shadow:
0 25px 80px rgba(0,0,0,.35),
inset 0 1px 0 rgba(255,255,255,.045);
backdrop-filter:blur(20px);
-webkit-backdrop-filter:blur(20px);
overflow:hidden;
}

.card::before{
content:"";
position:absolute;
left:-30%;
top:0;
width:35%;
height:100%;
background:
linear-gradient(
90deg,
transparent,
rgba(255,255,255,.06),
transparent
);
transform:skewX(-20deg);
animation:cardShine 5s ease-in-out infinite;
}

@keyframes cardShine{
0%,65%{
left:-40%;
}
100%{
left:120%;
}
}

.card-top{
display:flex;
align-items:center;
justify-content:space-between;
gap:12px;
margin-bottom:17px;
}

.card-label{
display:flex;
align-items:center;
gap:9px;
color:#c0bbc9;
font-size:12px;
font-weight:700;
}

.card-icon{
width:27px;
height:27px;
display:grid;
place-items:center;
border-radius:9px;
background:rgba(139,108,255,.11);
border:1px solid rgba(139,108,255,.16);
color:#a997ff;
font-size:13px;
}

.percent{
color:#716b7b;
font-size:11px;
font-weight:700;
}

.progress{
position:relative;
width:100%;
height:5px;
overflow:hidden;
border-radius:999px;
background:rgba(255,255,255,.06);
}

.progress::before{
content:"";
position:absolute;
left:-40%;
top:0;
width:40%;
height:100%;
border-radius:inherit;
background:
linear-gradient(
90deg,
transparent,
#9a80ff,
#d2c8ff,
#8066ff,
transparent
);
box-shadow:
0 0 18px rgba(135,105,255,.7);
animation:progressMove 2s cubic-bezier(.4,0,.2,1) infinite;
}

@keyframes progressMove{
0%{
left:-45%;
}
100%{
left:105%;
}
}

.card-bottom{
display:flex;
justify-content:space-between;
margin-top:13px;
font-size:10px;
color:#625d6c;
letter-spacing:.6px;
text-transform:uppercase;
}

/* =========================================
   SYSTEM ITEMS
========================================= */

.system{
display:flex;
justify-content:center;
align-items:center;
gap:16px;
margin-top:20px;
color:#625d6c;
font-size:10px;
}

.system-item{
display:flex;
align-items:center;
gap:6px;
}

.system-dot{
width:5px;
height:5px;
border-radius:50%;
background:#6e6778;
}

.system-dot.active{
background:#9b83ff;
box-shadow:0 0 8px rgba(150,120,255,.8);
}

/* =========================================
   FOOTER
========================================= */

.footer{
margin-top:36px;
font-size:10px;
letter-spacing:1px;
color:#514c5b;
}

.footer-brand{
color:#777181;
font-weight:700;
}

.footer-separator{
margin:0 7px;
color:#3e3a46;
}

/* =========================================
   CORNER UI
========================================= */

.corner{
position:fixed;
width:45px;
height:45px;
opacity:.35;
pointer-events:none;
}

.corner::before,
.corner::after{
content:"";
position:absolute;
background:#8d7aff;
}

.corner.tl{
top:25px;
left:25px;
border-top:1px solid rgba(140,120,255,.25);
border-left:1px solid rgba(140,120,255,.25);
}

.corner.tr{
top:25px;
right:25px;
border-top:1px solid rgba(140,120,255,.25);
border-right:1px solid rgba(140,120,255,.25);
}

.corner.bl{
bottom:25px;
left:25px;
border-bottom:1px solid rgba(140,120,255,.25);
border-left:1px solid rgba(140,120,255,.25);
}

.corner.br{
bottom:25px;
right:25px;
border-bottom:1px solid rgba(140,120,255,.25);
border-right:1px solid rgba(140,120,255,.25);
}

/* =========================================
   SCAN LINE
========================================= */

.scanline{
position:fixed;
z-index:4;
left:0;
right:0;
height:1px;
background:
linear-gradient(
90deg,
transparent,
rgba(150,125,255,.18),
transparent
);
opacity:.25;
animation:scan 8s linear infinite;
pointer-events:none;
}

@keyframes scan{
0%{
top:-5%;
}
100%{
top:105%;
}
}

/* =========================================
   RESPONSIVE
========================================= */

@media(max-width:600px){

body{
padding:20px;
}

.main{
width:100%;
}

.logo-wrap{
width:84px;
height:84px;
margin-bottom:26px;
}

.logo{
border-radius:25px;
}

.logo::before{
border-radius:24px;
}

.logo-text{
font-size:39px;
}

.logo-ring{
inset:-11px;
border-radius:28px;
}

.title{
font-size:clamp(43px,13vw,62px);
letter-spacing:-4px;
}

.subtitle{
font-size:14px;
line-height:1.7;
}

.card{
margin-top:28px;
padding:17px;
border-radius:17px;
}

.system{
gap:10px;
font-size:9px;
}

.corner{
display:none;
}

.footer{
margin-top:28px;
}

}

@media(max-height:700px){

.logo-wrap{
margin-bottom:20px;
}

.status{
margin-bottom:13px;
}

.subtitle{
margin-top:15px;
}

.card{
margin-top:23px;
}

.footer{
margin-top:22px;
}

}

@media(prefers-reduced-motion:reduce){

*,
*::before,
*::after{
animation-duration:.01ms!important;
animation-iteration-count:1!important;
scroll-behavior:auto!important;
}

}
</style>
</head>

<body>

<!-- BACKGROUND -->

<div class="background">

<div class="aurora a"></div>
<div class="aurora b"></div>
<div class="aurora c"></div>

<div class="grid"></div>
<div class="vignette"></div>
<div class="noise"></div>

<div class="particles">

<div class="particle"></div>
<div class="particle"></div>
<div class="particle"></div>
<div class="particle"></div>
<div class="particle"></div>
<div class="particle"></div>
<div class="particle"></div>
<div class="particle"></div>
<div class="particle"></div>
<div class="particle"></div>

</div>

</div>

<!-- SCAN -->

<div class="scanline"></div>

<!-- CORNERS -->

<div class="corner tl"></div>
<div class="corner tr"></div>
<div class="corner bl"></div>
<div class="corner br"></div>

<!-- MAIN -->

<main class="main">

<!-- LOGO -->

<div class="logo-wrap">

<div class="logo-ring"></div>

<div class="logo">

<div class="logo-text">
Z
</div>

</div>

</div>

<!-- STATUS -->

<div class="status">

<span class="status-dot"></span>

<span>
System Maintenance
</span>

</div>

<!-- TITLE -->

<h1 class="title">
<span class="accent">ZNAL</span> Error
</h1>

<!-- SUBTITLE -->

<p class="subtitle">

<strong>ZNAL AI</strong> sedang mengalami gangguan sementara
dan saat ini sedang diperbaiki oleh sistem.

<br>

Mohon tunggu beberapa saat sampai layanan kembali normal.

</p>

<!-- CARD -->

<div class="card">

<div class="card-top">

<div class="card-label">

<div class="card-icon">
↻
</div>

<span>
Memperbaiki sistem
</span>

</div>

<div class="percent">
PROCESSING
</div>

</div>

<div class="progress"></div>

<div class="card-bottom">

<span>
ZNAL CORE
</span>

<span>
SYSTEM RECOVERY
</span>

</div>

</div>

<!-- SYSTEM STATUS -->

<div class="system">

<div class="system-item">

<span class="system-dot active"></span>

<span>CORE</span>

</div>

<div class="system-item">

<span class="system-dot active"></span>

<span>AI</span>

</div>

<div class="system-item">

<span class="system-dot"></span>

<span>SYNC</span>

</div>

</div>

<!-- FOOTER -->

<div class="footer">

<span class="footer-brand">
ZNAL AI
</span>

<span class="footer-separator">
•
</span>

<span>
BUILT BY NALANEO
</span>

</div>

</main>

<script>

(function(){

"use strict";

const percent =
document.querySelector(".percent");

const messages = [
"PROCESSING",
"REPAIRING",
"OPTIMIZING",
"SYNCING",
"RECOVERING"
];

let index = 0;

setInterval(() => {

index++;

if(index >= messages.length){
index = 0;
}

if(percent){

percent.style.opacity = "0";

setTimeout(() => {

percent.textContent =
messages[index];

percent.style.opacity = "1";

},180);

}

},2400);

})();

</script>

</body>
</html>
